name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  backend:
    name: Backend Tests (Rails & RSpec)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: marketplace
          POSTGRES_PASSWORD: password
          POSTGRES_DB: marketplace_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install System Dependencies (libvips, postgres)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libvips libvips-dev libpq-dev

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2.4'
          bundler-cache: true
          working-directory: ./backend

      - name: Set up Test Database
        env:
          RAILS_ENV: test
          DB_HOST: localhost
          DB_PORT: 5432
          POSTGRES_USER: marketplace
          POSTGRES_PASSWORD: password
        run: |
          bundle exec rails db:create
          bundle exec rails db:schema:load

      - name: Run RSpec Tests
        env:
          RAILS_ENV: test
          DB_HOST: localhost
          DB_PORT: 5432
          POSTGRES_USER: marketplace
          POSTGRES_PASSWORD: password
        run: bundle exec rspec

  frontend:
    name: Frontend Quality & Build (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ./frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run Lint
        run: npm run lint

      - name: Run Jest Tests
        run: npm test -- --passWithNoTests

      - name: Test Production Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3001
