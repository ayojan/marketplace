name: Build, Push to GHCR & Deploy to OCI Ampere VM

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'docker/**'
      - 'docker-compose.yml'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  # ----------------------------------------------------------------------------
  # Job 1: Build & Push Both Backend and Frontend Docker Images in Parallel
  # Target architecture: linux/arm64 (OCI Ampere A1 Flex native ARM architecture)
  # ----------------------------------------------------------------------------
  build-and-push:
    name: Build & Push (${{ matrix.name }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: ./backend
            dockerfile: ./backend/Dockerfile
          - name: frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up QEMU (for ARM64 cross-compilation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare Lowercase Image Name
        run: |
          IMAGE_NAME=$(echo "${{ env.REGISTRY }}/${{ github.repository }}-${{ matrix.name }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_NAME=${IMAGE_NAME}" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=

      - name: Build and Push ARM64 Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ----------------------------------------------------------------------------
  # Job 2: Deploy to OCI Ampere VM via production.yml
  # ----------------------------------------------------------------------------
  deploy:
    name: Deploy to OCI Ampere VM
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Copy docker-compose.yml and Nginx config to OCI VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.OCI_HOST || secrets.GCE_HOST }}
          username: ${{ secrets.OCI_USERNAME || secrets.GCE_USERNAME || 'ubuntu' }}
          key: ${{ secrets.OCI_SSH_KEY || secrets.GCE_SSH_KEY }}
          source: "docker-compose.yml,docker/nginx/prod.conf"
          target: "~/marketplace"

      - name: Deploy via SSH using Docker Compose
        uses: appleboy/ssh-action@v1.0.3
        env:
          ENV_CONTENT: ${{ secrets.ENV_PRODUCTION || secrets.PRODUCTION_ENV || secrets.PROD_ENV || secrets.ENV_FILE }}
          REGISTRY: ${{ env.REGISTRY }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_LOWER: ${{ github.repository }}
        with:
          host: ${{ secrets.OCI_HOST || secrets.GCE_HOST }}
          username: ${{ secrets.OCI_USERNAME || secrets.GCE_USERNAME || 'ubuntu' }}
          key: ${{ secrets.OCI_SSH_KEY || secrets.GCE_SSH_KEY }}
          envs: ENV_CONTENT,REGISTRY,GHCR_USERNAME,GHCR_TOKEN,REPO_LOWER
          script: |
            set -e

            echo "📁 Ensuring deployment directory exists..."
            mkdir -p ~/marketplace
            cd ~/marketplace

            echo "🔐 Updating production environment variables..."
            if [ -n "$ENV_CONTENT" ]; then
              echo "$ENV_CONTENT" > ~/.env.production
              chmod 600 ~/.env.production
            fi

            # Format image names in lowercase
            REPO_CLEAN=$(echo "$REPO_LOWER" | tr '[:upper:]' '[:lower:]')
            BACKEND_IMG="${REGISTRY}/${REPO_CLEAN}-backend:latest"
            FRONTEND_IMG="${REGISTRY}/${REPO_CLEAN}-frontend:latest"

            # Ensure default images exist in .env.production if not already set
            if [ -f ~/.env.production ]; then
              grep -q "BACKEND_IMAGE=" ~/.env.production || echo "BACKEND_IMAGE=${BACKEND_IMG}" >> ~/.env.production
              grep -q "FRONTEND_IMAGE=" ~/.env.production || echo "FRONTEND_IMAGE=${FRONTEND_IMG}" >> ~/.env.production
            fi

            echo "🔑 Authenticating Docker with GitHub Container Registry..."
            echo "$GHCR_TOKEN" | docker login "$REGISTRY" -u "$GHCR_USERNAME" --password-stdin

            echo "📦 Pulling latest production images..."
            docker compose --env-file ~/.env.production pull

            echo "🚀 Launching / upgrading stack with zero downtime..."
            docker compose --env-file ~/.env.production up -d --remove-orphans

            echo "⚡ Running database migrations..."
            docker compose --env-file ~/.env.production exec -T backend bin/rails db:migrate

            echo "🧹 Cleaning up old unused image layers..."
            docker image prune -af --filter "until=72h"

            echo "📊 Verifying running containers..."
            docker compose --env-file ~/.env.production ps

            echo "✅ Deployment to OCI completed successfully!"
