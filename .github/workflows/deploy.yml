name: Build, Push to GHCR & Deploy to OCI Ampere VM

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'docker/**'
      - 'docker-compose.yml'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  # ----------------------------------------------------------------------------
  # Job 1: Detect which components changed in this commit
  # ----------------------------------------------------------------------------
  changes:
    name: Detect Changed Services
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Path Filter
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'docker-compose.yml'
              - '.github/workflows/deploy.yml'
            frontend:
              - 'frontend/**'
              - 'docker-compose.yml'
              - '.github/workflows/deploy.yml'

  # ----------------------------------------------------------------------------
  # Job 2: Build & Push Backend Docker Image (ARM64)
  # Only runs if backend files or compose/workflow files changed
  # ----------------------------------------------------------------------------
  build-backend:
    name: Build & Push Backend (ARM64)
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up QEMU (for ARM64 cross-compilation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare Lowercase Image Name
        run: |
          IMAGE_NAME=$(echo "${{ env.REGISTRY }}/${{ github.repository }}-backend" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_NAME=${IMAGE_NAME}" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ----------------------------------------------------------------------------
  # Job 3: Build & Push Frontend Docker Image (ARM64)
  # Only runs if frontend files or compose/workflow files changed
  # ----------------------------------------------------------------------------
  build-frontend:
    name: Build & Push Frontend (ARM64)
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up QEMU (for ARM64 cross-compilation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare Lowercase Image Name
        run: |
          IMAGE_NAME=$(echo "${{ env.REGISTRY }}/${{ github.repository }}-frontend" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_NAME=${IMAGE_NAME}" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ----------------------------------------------------------------------------
  # Job 4: Deploy to OCI Ampere VM via SSH
  # Only restarts the service that was rebuilt!
  # ----------------------------------------------------------------------------
  deploy:
    name: Deploy to OCI Ampere VM
    needs: [changes, build-backend, build-frontend]
    if: always() && !cancelled() && !contains(needs.*.result, 'failure') && (needs.build-backend.result == 'success' || needs.build-frontend.result == 'success' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Copy docker-compose.yml and Nginx config to OCI VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USERNAME || 'opc' }}
          key: ${{ secrets.OCI_SSH_KEY }}
          source: "docker-compose.yml,docker/nginx/prod.conf"
          target: "~/marketplace"

      - name: Deploy via SSH using Docker Compose
        uses: appleboy/ssh-action@v1.0.3
        env:
          ENV_CONTENT: ${{ secrets.ENV_PRODUCTION || secrets.PRODUCTION_ENV }}
          REGISTRY: ${{ env.REGISTRY }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_LOWER: ${{ github.repository }}
          BACKEND_CHANGED: ${{ needs.changes.outputs.backend }}
          FRONTEND_CHANGED: ${{ needs.changes.outputs.frontend }}
          IS_DISPATCH: ${{ github.event_name == 'workflow_dispatch' }}
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USERNAME || 'opc' }}
          key: ${{ secrets.OCI_SSH_KEY }}
          envs: ENV_CONTENT,REGISTRY,GHCR_USERNAME,GHCR_TOKEN,REPO_LOWER,BACKEND_CHANGED,FRONTEND_CHANGED,IS_DISPATCH
          script: |
            set -e

            echo "📁 Ensuring deployment directory exists..."
            mkdir -p ~/marketplace
            cd ~/marketplace

            echo "🔐 Updating production environment variables..."
            if [ -n "$ENV_CONTENT" ]; then
              echo "$ENV_CONTENT" > ~/.env.production
              chmod 600 ~/.env.production
            fi

            REPO_CLEAN=$(echo "$REPO_LOWER" | tr '[:upper:]' '[:lower:]')
            export BACKEND_IMAGE="${REGISTRY}/${REPO_CLEAN}-backend:latest"
            export FRONTEND_IMAGE="${REGISTRY}/${REPO_CLEAN}-frontend:latest"

            echo "📦 Target Backend Image:  $BACKEND_IMAGE"
            echo "📦 Target Frontend Image: $FRONTEND_IMAGE"

            # Ensure ~/.env.production always has the accurate image paths
            sed -i '/^BACKEND_IMAGE=/d' ~/.env.production 2>/dev/null || true
            sed -i '/^FRONTEND_IMAGE=/d' ~/.env.production 2>/dev/null || true
            echo "BACKEND_IMAGE=${BACKEND_IMAGE}" >> ~/.env.production
            echo "FRONTEND_IMAGE=${FRONTEND_IMAGE}" >> ~/.env.production

            echo "🔑 Authenticating Docker with GitHub Container Registry..."
            echo "$GHCR_TOKEN" | docker login "$REGISTRY" -u "$GHCR_USERNAME" --password-stdin

            # Selective Pull & Restart
            if [ "$BACKEND_CHANGED" = "true" ] || [ "$IS_DISPATCH" = "true" ]; then
              echo "📦 Updating Backend service..."
              docker compose --env-file ~/.env.production pull backend
              docker compose --env-file ~/.env.production up -d --no-deps backend
              echo "⚡ Running database migrations..."
              docker compose --env-file ~/.env.production exec -T backend bin/rails db:migrate
            fi

            if [ "$FRONTEND_CHANGED" = "true" ] || [ "$IS_DISPATCH" = "true" ]; then
              echo "📦 Updating Frontend service..."
              docker compose --env-file ~/.env.production pull frontend
              docker compose --env-file ~/.env.production up -d --no-deps frontend
            fi

            # Ensure proxy & base services (db, redis, nginx) are up
            docker compose --env-file ~/.env.production up -d --remove-orphans

            echo "🧹 Cleaning up old unused image layers..."
            docker image prune -af --filter "until=72h"

            echo "📊 Verifying running containers..."
            docker compose --env-file ~/.env.production ps

            echo "✅ Deployment to OCI completed successfully!"
