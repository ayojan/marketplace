# Local macOS Nginx configuration for Ayoj Marketplace
# Proxies ayoj.test (port 80) -> localhost:3000 (Next.js)
# Proxies admin.ayoj.test (port 80) -> localhost:3001 (Rails ActiveAdmin)
# Proxies api.ayoj.test (port 80) -> localhost:3001 (Rails API)

events {
    worker_connections 1024;
}

http {
    include       /opt/homebrew/etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    client_max_body_size 50M;

    upstream local_frontend {
        server 127.0.0.1:3000;
    }

    upstream local_backend {
        server 127.0.0.1:3001;
    }

    # 1. Admin Portal: admin.ayoj.test
    server {
        listen 80;
        server_name admin.ayoj.test;

        # Redirect root to /admin
        location = / {
            return 302 /admin;
        }

        location / {
            proxy_pass http://local_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
        }
    }

    # 2. Backend API: api.ayoj.test
    server {
        listen 80;
        server_name api.ayoj.test;

        location / {
            proxy_pass http://local_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # 3. Customer Frontend: ayoj.test
    server {
        listen 80;
        server_name ayoj.test;

        location / {
            proxy_pass http://local_frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Next.js WebSocket HMR Support
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # Optional: Direct /api proxy
        location /api/ {
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://local_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
