plugins:
  - rubocop-rails
  - rubocop-rspec
  - rubocop-performance
  - rubocop-factory_bot
  - rubocop-rspec_rails

AllCops:
  NewCops: enable
  Exclude:
    - 'db/**/*'
    - 'bin/**/*'
    - 'node_modules/**/*'
    - 'vendor/**/*'
    - 'config/environments/*'
    - 'lib/tasks/*.rake'

Rails:
  Enabled: true

Rails/DynamicFindBy:
  AllowedMethods:
    - find_by_sql
    - find_by_token_for
    - find_by_id_or_slug
    - find_by_id_or_slug!

# Commonly tweaked rules for modern Rails
Style/Documentation:
  Enabled: false

Style/FrozenStringLiteralComment:
  Enabled: true
  EnforcedStyle: always
  Exclude:
    - 'config/**/*'
    - 'Gemfile'
    - 'Rakefile'

Metrics/MethodLength:
  Max: 20
  Exclude:
    - 'db/migrate/*'

Metrics/AbcSize:
  Max: 30

Metrics/BlockLength:
  Exclude:
    - 'spec/**/*'
    - 'config/routes.rb'
    - 'config/routes/**/*'
    - 'lib/tasks/**/*'
    - 'app/admin/**/*'

Style/ClassAndModuleChildren:
  Enabled: false

Layout/LineLength:
  Max: 120
  Exclude:
    - 'config/initializers/*'

RSpec/DescribeClass:
  Exclude:
    - 'spec/integration/**/*'
    - 'spec/jobs/sidekiq_queue_assignment_spec.rb'
    - 'spec/requests/**/*'

RSpec/MultipleExpectations:
  Max: 10
  Exclude:
    - 'spec/integration/**/*'

RSpec/NestedGroups:
  Max: 5

RSpec/ExampleLength:
  Max: 50
  Exclude:
    - 'spec/integration/**/*'

RSpec/MultipleMemoizedHelpers:
  Max: 12

